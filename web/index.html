<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Taskify - Simple task management app">
  <meta name="theme-color" content="#2196F3">
  <meta name="google-signin-client_id" content="929046134968-m6ffgsd8dsoatabi7lvkjdsqfnlm041n.apps.googleusercontent.com">
  <!-- ВАЖНО: НЕ зареждай ръчно accounts.google.com/gsi/client тук!
       google_sign_in_web сам инжектира скрипта СЛЕД като сетне callback-а
       window.onGoogleLibraryLoad. Ако SDK-то се зареди по-рано (ръчен таг),
       callback-ът се губи и бутонът стои вечно на „Getting ready". -->
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Taskify">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Taskify</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Авто-обновяване на service worker: новите deploy-и да се виждат БЕЗ
    // ръчно „Clear site data". При нова версия → skipWaiting + еднократен reload.
    if ('serviceWorker' in navigator) {
      // Когато нов SW поеме контрол (нов deploy активиран) → презареди веднъж.
      var __reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (__reloading) return;
        __reloading = true;
        window.location.reload();
      });
      // flutter_bootstrap регистрира SW асинхронно → изчакай ready, после следи.
      navigator.serviceWorker.ready.then(function (reg) {
        function __check() { reg.update().catch(function () {}); }
        __check();                 // провери веднага при зареждане
        setInterval(__check, 60000); // и на всеки 60 сек
        reg.addEventListener('updatefound', function () {
          var sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', function () {
            // Нова версия инсталирана, но има стар контролиращ SW → активирай я.
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              sw.postMessage('skipWaiting');
            }
          });
        });
      });
    }
  </script>
</body>
</html>
